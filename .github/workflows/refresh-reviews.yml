name: Refresh Google reviews

# ---------------------------------------------------------------------------
# Runs every Monday at 6 AM Phoenix time. Pulls the latest 5 reviews Google
# considers "most relevant" from the Places API, writes them to
# build/data/google_reviews.json, commits the change, and pushes to main —
# which Sevalla picks up and auto-deploys within ~60 seconds.
#
# To run on demand, click "Run workflow" on the Actions tab in GitHub.
#
# Prerequisites (one-time GitHub setup):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     • GOOGLE_PLACES_API_KEY  (the Places API key restricted to Places API)
#     • GOOGLE_PLACE_ID        (ChIJ…)
# ---------------------------------------------------------------------------

on:
  schedule:
    # Cron is in UTC. Phoenix is MST year-round (UTC−7, no DST).
    # 6 AM Phoenix = 13:00 UTC. Monday = day-of-week 1.
    - cron: "0 13 * * 1"
  workflow_dispatch: {}   # Allows on-demand runs via the Actions tab UI.
  push:
    # Auto-refresh after every deploy. The job-level `if:` below skips this
    # run when the push came from the bot itself, which is what prevents an
    # infinite loop: human push → workflow runs → bot pushes (skipped).
    branches: [main]

permissions:
  contents: write          # Required so the bot can commit + push back to main.

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    # Skip if the triggering push was by the bot — otherwise the bot's own
    # commit (after the refresh) would re-trigger this workflow → infinite
    # loop. Manual dispatch, schedule, and human pushes still run normally.
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Use the default GITHUB_TOKEN; permissions block above grants write.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        # build.py uses Pillow to handle hero images.
        run: pip install --quiet pillow

      - name: Fetch fresh reviews from Google Places API
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: bash fetch-reviews.sh

      - name: Rebuild the site
        # Without this, the workflow would update build/data/google_reviews.json
        # but the rendered HTML + assets/data/iha-knowledge.json that Sevalla
        # actually serves would still show the old count. Run the same build
        # script we run locally so source + output stay in sync.
        #
        # build.py writes its output to ./site/, but Mark's deploy.sh ships
        # the contents of site/ to the REPO ROOT (where Sevalla actually
        # serves from). So after building, we promote site/* to root and
        # drop the now-stale site/ subfolder so the commit only contains
        # the files that get served. Otherwise the workflow would push the
        # rebuilt files to ./site/* (a path Sevalla ignores) and the live
        # site would never change.
        run: |
          python build/build.py
          # Use cp -R with the trailing /. idiom to copy CONTENTS only.
          cp -R site/. .
          rm -rf site

      - name: Commit + push if reviews changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage everything that changed — build.py regenerated files at
          # the repo root (after the cp -R site/. . step above), plus the
          # source JSON. Use `git add -A` so renames + deletions both land.
          git add -A
          if git diff --staged --quiet; then
            echo "✔ No changes — Google returned the same snapshot."
            exit 0
          fi

          # Read review counts from the JSON so the commit message is informative.
          RATING=$(grep -o '"rating"[[:space:]]*:[[:space:]]*[0-9.]*' build/data/google_reviews.json \
            | head -1 | grep -o '[0-9.]*$')
          TOTAL=$(grep -o '"user_ratings_total"[[:space:]]*:[[:space:]]*[0-9]*' build/data/google_reviews.json \
            | head -1 | grep -o '[0-9]*$')
          git commit -m "chore(reviews): auto-refresh — ${RATING}★ on ${TOTAL} reviews"

          # Push with retry: if main has moved since checkout, rebase our single
          # commit onto the latest main and try again. Up to 3 attempts handles
          # the rare case of multiple concurrent pushes.
          push_ok=0
          for attempt in 1 2 3; do
            if git push; then
              push_ok=1
              echo "✓ Pushed on attempt ${attempt}. Sevalla will redeploy in ~60s."
              break
            fi
            echo "⚠ Push attempt ${attempt} rejected (remote moved). Rebasing on latest main…"
            git pull --rebase origin main
          done

          if [ "$push_ok" != "1" ]; then
            echo "❌ Push still failing after 3 attempts. Aborting."
            exit 1
          fi
